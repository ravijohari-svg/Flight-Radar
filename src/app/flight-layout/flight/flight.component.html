<h3 class="formhead my-4">Flight TakeOff details</h3>
<form *ngIf="!successFlag" class="form-horizontal mx-5 px-sm-5 px-3 my-3" [formGroup]="flightform"  (ngSubmit)="submitDetail()" >
    <div class="form-group row my-3">
      <label class="control-label col-sm-2" for="email">Product Name</label>
      <div class="col-sm-10">
        <input formControlName = "ProductName" type="text" class="form-control" id="email" placeholder="Enter Product Name">
        <span class="errormsg" *ngIf = "submitted && productName && productName.invalid"> Field is requiired *</span>
      </div>
    </div>
    <div class="form-group row my-3">
      <label class="control-label col-sm-2" for="pwd">Departure Time</label>
      <div class="col-sm-10">
        <input formControlName = "DepartureTime" type="time" class="form-control" id="pwd" placeholder="Enter departure Time">
        <span class="errormsg" *ngIf = "submitted && departureTime && departureTime.invalid"> Field is requiired *</span>
     
    </div>
    </div>

    <div class="form-group row my-3">
        <label class="control-label col-sm-2" for="pwd">Delivery Date</label>
        <div class="col-sm-10">
          <input formControlName = "DeliveryDate"  type="date" class="form-control" id="pwd" placeholder="Enter departure Time">
          <span class="errormsg" *ngIf = "submitted && deliveryDate && deliveryDate.invalid"> Field is requiired *</span>
       
        </div>
      </div>

      <div class="form-group row my-3">
        <label class="control-label col-sm-2" for="pwd">ETA (mins)</label>
        <div class="col-sm-10">
          <input formControlName = "ETA"  type="number" class="form-control" id="pwd" placeholder="Enter departure Time">
          <span class="errormsg" *ngIf = "submitted && eta && eta.invalid"> Field is requiired *</span>
          
        </div>
       
      </div>
      <div class="text-center">
      <button class="btn primary-btn px-2" [disabled] = "flightform.invalid" class="btn btn-primary">Submit</button>
    </div>
  </form>

  <div *ngIf="successFlag" class="alert alert-success mx-5 text-center px-5" role="alert">
    <div class="f-14 ">TakeOff submitted successfully</div>
    <button class="primary-btn btn my-1" (click)="onCancel()">Okay</button>
  </div>
