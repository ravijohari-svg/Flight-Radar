<div class="login">
  <div class="leftBox">
    <img src="../../../assets/icons/loginBg.png" alt="" />
    <div class="loginHeading">
      <p>Automating the skies.</p>
      <p>Connecting operators with authorities for a safer airspace</p>
    </div>
  </div>

  <div class="rightBox">
    <div class="logo">
      <img
        src="../../../assets/common-layout/SkyeUTM logoWhite.svg"
        alt="SkyeUTM"
        title="SkyeUTM Logo"
      />
    </div>
    <div class="loginFormBox">
      <p class="rightBoxlogin text-white mb-3">Forgot Password</p>
      <div class="formBox">
        <form [formGroup]="forgotPasswordForm">
          <!-- Email ID field -->
          <div class="mb-4 mt-2">
            <div class="form-group">
              <label for="formGroupExampleInput">Email ID</label>
              <input
                #authEmail
                type="email"
                class="form-control dark-medium"
                formControlName="EmailID"
                [ngClass]="{
                  'is-invalid':
                    submitted && forgotPasswordForm.controls.EmailID.errors
                }"
              />
              <div
                *ngIf="submitted && forgotPasswordForm.controls.EmailID.errors"
                class="invalid-feedback"
              >
                <div
                  *ngIf="forgotPasswordForm.controls.EmailID.errors.required"
                >
                  Email ID is required
                </div>
                <div *ngIf="forgotPasswordForm.controls.EmailID.errors.email">
                  Invalid Email ID
                </div>
              </div>
            </div>
          </div>

          <!-- Error message for login failure -->
          <div *ngIf="loginFail !== ''" class="error-message">
            {{ loginFail }}
          </div>

          <!-- Login button -->

          <div class="loginBtn my-3">
            <button
              class="btn primary-btn px-5"
              (click)="onForgotPasswordFormSubmit()"
              *ngIf="!loader"
            >
              Reset Password
            </button>
            <div *ngIf="loader">
              <button class="btn primary-btn px-5">
                <img
                  src="../../../../../assets/common-layout/SquareLoader.gif"
                  width="20px"
                />
              </button>
            </div>
          </div>
          <!-- Forgot Password link -->
          <div class="text-left mt-2 forgotText">
            <span (click)="backToLogin()">Back to login</span>
          </div>
        </form>
      </div>
      <div class="hint p-2 p-lg-4">
        <p class="f-12 text-white">
          Please enter registered email you used at the time of registration to
          get the password reset instructions.
        </p>
      </div>
    </div>
  </div>
</div>
