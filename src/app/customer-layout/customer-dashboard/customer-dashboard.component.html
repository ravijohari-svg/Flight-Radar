<div class="main-layout">
  <div class="header">
    <img src="../../../assets/common-layout/SkyeAir.png" width="100px" >
  </div>
  <!-- <div id="right-logo">
    <img src="../../../assets/common-layout/cropped darc logo.png" width="90px" class="mx-3">
    <img src="../../../assets/common-layout/SHEF_FINAL.png" width="60px">
  </div> -->

  <div class="mission-layout px-3 py-2">
    <div class="list-values my-2">Missions List</div>
    <div *ngIf="onGoingMissionsList && onGoingMissionsList.length == 0" class="card card-outer empty-state-card h-100">
      <div class="card-body text-center">
        <div class="my-3">
          <i class="fa fa-minus-circle" aria-hidden="true"></i>
        </div>
        <div class="empty-state-header">
          No Ongoing Missions found!
        </div>
        <div class="my-2 empty-state-text">
          Monitor/Track Active Missions once Pilots start their Missions
        </div>
      </div>
    </div>

    <accordion [closeOthers]="true" [isAnimated]="true">
      <!-- (isOpenChange)="log($event)" -->
      <accordion-group *ngFor="let mission of onGoingMissionsList" class="mb-2 customer-accordion"  [isOpen]="mission.IsOpen">

        <button class="btn  btn-block w-100  shadow-none px-0 py-1" accordion-heading type="button"
          (click)="getSpecifiedMission(mission?.MissionId)">
          <div class="header row mx-0">
            <div class="col-8 pr-0 pl-2 text-left">
              <div class="sub-header">{{mission?.OperationName}}
                <span *ngIf="mission.LiveStatus == 'Active' " class="text-left  pl-2">
                  <i class="fa fa-circle fa-circle-live" aria-hidden="true"></i>
                  <span class="pl-1 light-txt-label">Live</span>
                </span>
              </div>
              <div *ngIf="(mission.StartTime | date: 'dd-MM-yyyy') != (mission.EndTime | date: 'dd-MM-yyyy')"
                class="list-description my-1 font-12 text-left ">
                <!-- pl-2 -->
                {{mission.StartTime | date: 'd MMM y, h:mm a'}} -
                {{mission.EndTime | date: 'd MMM y, h:mm a'}}
              </div>
              <div *ngIf="(mission.StartTime | date: 'dd-MM-yyyy') == (mission.EndTime | date: 'dd-MM-yyyy')"
                class="list-description my-1 font-12 text-left ">
                {{mission.StartTime | date: 'd MMM y' }} ,
                {{mission.StartTime | date: 'h:mm a'}} -
                {{mission.EndTime | date: 'h:mm a'}}
              </div>
              <button *ngIf="(mission?.MissionId == missionDetail?.MissionId) && (latestMissionLogs?.ETA != undefined)" class="btn huge-txt my-1 p-1">ETA {{latestMissionLogs?.ETA | number : '.0-0'}} min(s)</button>
              <!-- {{latestMissionLogs?.ETA | number : '.1-2'}} -->
            </div>
            <div class="col-4 pl-1 pr-2 mt-1 text-right">
              <button disabled class="btn px-1 py-1 font-10"
                [ngClass]="{'approve': mission?.MissionStatus == 'Approved', 'reject': mission?.MissionStatus == 'Rejected', 'pending': mission?.MissionStatus == 'Pending'}">
                {{mission?.MissionStatus | uppercase}} ({{mission?.ApprovalMode}})
              </button>

            </div>
          </div>
        </button>

      </accordion-group>
    </accordion>
  </div>
  <div class="map-container">
    <ng-template appResuableOutlet></ng-template>
  </div>
</div>
