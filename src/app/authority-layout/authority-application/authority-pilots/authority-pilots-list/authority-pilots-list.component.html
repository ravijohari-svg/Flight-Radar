  </div>
</div>

<div *ngIf="!loader" class="px-lg-4 py-3 main-panel">
  <div class="mx-3">
    <div class="header my-3 white-text-opacity">Pilots</div>

    <div class=" table-responsive my-2">
      <table class=" table table-bordered dark-medium ">
        <thead>
          <tr>
            <th scope="col">OPERATOR ID</th>
            <th scope="col">NAME</th>
            <th scope="col">EMAIL ID</th>
            <th scope="col">PHONE NUMBER</th>
            <th scope="col">REGISTRATION DATE</th>
            <th scope="col">LAST ACTIVE</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pilot of pilotsList">
            <td> {{pilot.UserId}} </td>
            <td>{{pilot.FirstName}}</td>
            <td>{{pilot.EmailId}}</td>
            <td>{{pilot.PhoneNumber}}</td>
            <td>{{pilot.TS_Created | date : 'dd MMM yyyy, h:mm a'}} </td>
            <td>{{pilot.LastLogin | date : 'dd MMM yyyy, h:mm a'}} </td>
            <!--  -->
          </tr>
        </tbody>
      </table>
    </div>
  </div>
